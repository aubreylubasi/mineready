<!DOCTYPE html>

<title>MineReady - Contractor Documents</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">

<style>
:root{
  --bg:#F4F5F2; --card:#FFFFFF; --line:#E2E5E0; --line2:#ECEEEA; --field:#B9C2C5;
  --ink:#172126; --ink2:#26343A; --muted:#47545A; --muted2:#56636A;
  --head:#15232A; --accent:#0F5F74; --accent-soft:#E2EEF0;
  --ok-bg:#E3F2E7; --ok:#1D6236; --ok-dot:#2E8B4E;
  --soon-bg:#FFF1D1; --soon:#7A4A00; --soon-dot:#D88A0B;
  --bad-bg:#FBE4E2; --bad:#9E1F17; --bad-dot:#C8372D;
  --miss-bg:#ECEEF0; --miss:#454D55; --miss-dot:#7B848C;
  --inc-bg:#FCE7D6; --inc:#8A3B05; --inc-dot:#D2691E;
  --wa:#17693B;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.2px;line-height:1.2}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
.top{position:sticky;top:0;z-index:20;background:var(--head);color:#fff}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:#E8A33D;color:#15232A;display:grid;place-items:center;flex:none}
.brand{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:19px;line-height:1.1;min-width:0}
.brand small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:12px;color:#B8C5CA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#C9D4D8;padding:5px 10px;border-radius:999px;background:#22343C;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#7B848C}
.sync.ok i{background:#3FB36B}.sync.warn i{background:#E8A33D}.sync.bad i{background:#E5484D}
main{max-width:760px;margin:0 auto;padding:16px 16px 104px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.flush{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.pill.valid{background:var(--ok-bg);color:var(--ok)}
.pill.soon{background:var(--soon-bg);color:var(--soon)}
.pill.expired{background:var(--bad-bg);color:var(--bad)}
.pill.missing{background:var(--miss-bg);color:var(--miss)}
.pill.incomplete{background:var(--inc-bg);color:var(--inc)}
.kpis.k5 .kpi:last-child:nth-child(odd){grid-column:1/-1}
@media(min-width:620px){.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}.kpis.k5 .kpi:last-child:nth-child(odd){grid-column:auto}}
.kgroup{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:2px 2px -6px}
.demo-banner{background:#15232A;color:#FFF;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;border-left:5px solid #E8A33D}
.why{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-top:1px solid var(--line2)}
.why .wt{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.why .we{font-size:13px;color:var(--muted)}
.why .wa{font-size:13px;color:var(--ink2)}
.why .wa b{font-weight:700}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--miss-bg);color:var(--miss)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:11px;border:1.5px solid #C9D0D2;background:#fff;color:var(--ink2);font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.btn:hover{border-color:#9AA5A9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0B4E60}
.btn.outline{border-color:var(--accent);color:var(--accent)}
.btn.danger{border-color:#E3ADA8;color:var(--bad)}
.btn.wa{border-color:var(--wa);color:var(--wa)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
.kpi .dot{width:10px;height:10px;border-radius:50%;flex:none}
.kpi .v{font-family:"Space Grotesk",Inter,sans-serif;font-size:32px;font-weight:700;line-height:1;margin-top:8px}
.bar{height:10px;border-radius:5px;background:#E3E6E2;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok-dot);border-radius:5px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line2);background:none;width:100%;text-align:left;cursor:pointer;color:inherit;text-decoration:none}
.li:hover{background:#FAFBF9}
.list>.li:first-child,.list>.lirow:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.li .s{font-size:12.5px;color:var(--muted2);margin-top:2px;overflow-wrap:anywhere}
.lirow{display:flex;align-items:stretch;border-top:1px solid var(--line2)}
.lirow .li{border-top:0}
.side-btn{display:flex;align-items:center;justify-content:center;min-width:52px;color:var(--wa);border-left:1px solid var(--line2);text-decoration:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 8px}
.sec-h h2{font-size:15px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field{margin-bottom:14px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=search],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--field);border-radius:10px;background:#fff;outline:none}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.check{display:flex;align-items:center;gap:10px;min-height:42px;cursor:pointer;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.check.dis{color:var(--muted2);cursor:default}
.hint{font-size:12px;color:var(--muted2);margin-top:5px}
.err{color:var(--bad);font-size:13px;margin-top:6px;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{min-height:42px;padding:0 14px;border-radius:8px;border:1.5px solid #C9D0D2;background:#fff;font-weight:600;cursor:pointer;font-size:14px}
.chipbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line)}
nav.bottom .in{max-width:760px;margin:0 auto;display:flex;padding:6px 4px 8px}
nav.bottom button{flex:1 1 0;min-height:54px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:#5B666B;cursor:pointer}
nav.bottom button .ic{width:52px;height:28px;border-radius:14px;display:grid;place-items:center}
nav.bottom button[aria-current=page]{color:var(--accent)}
nav.bottom button[aria-current=page] .ic{background:var(--accent-soft)}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(10,18,22,.55);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.modal-bg{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
@media(min-width:620px){.modal{border-radius:18px}}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:#EEF1EC;color:var(--ink2);display:grid;place-items:center;cursor:pointer;flex:none}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:80;background:#15232A;color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.bad{background:#9E1F17}
.banner{border-radius:12px;padding:12px 14px;font-size:13.5px;border:1px solid}
.banner.info{background:#E8F1F4;border-color:#BCD6DE;color:#0B4656}
.banner.warn{background:var(--soon-bg);border-color:#F0D28A;color:var(--soon)}
.banner.bad{background:var(--bad-bg);border-color:#EDB7B1;color:var(--bad)}
.banner.ok{background:var(--ok-bg);border-color:#A9D8B7;color:var(--ok)}
.banner b{font-weight:700}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.preview{max-width:100%;max-height:60vh;border-radius:10px;border:1px solid var(--line);display:block;margin:0 auto}
.filebox{display:flex;align-items:center;gap:12px;padding:10px;border:1.5px dashed #9AA5A9;border-radius:12px;flex-wrap:wrap}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#EEF1EC;display:grid;place-items:center;flex:none;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
@media(max-width:420px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:6px}}
.hero{display:flex;flex-direction:column;gap:12px;padding:22px 18px}
.hero .mark{width:52px;height:52px;border-radius:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:460px){.grid2{grid-template-columns:1fr}}
.icon-left{display:inline-flex;align-items:center;gap:6px}
.backbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0;min-height:40px;font-size:14px}
.cleared-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.cleared-tag.yes{background:var(--ok-bg);color:var(--ok)}
.cleared-tag.no{background:var(--bad-bg);color:var(--bad)}
.progress{font-size:13px;color:var(--muted);min-height:18px}
.sec li{margin-bottom:8px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo">
    <div class="mark" id="logoMark" aria-hidden="true"></div>
    <div class="brand">MineReady<small id="subName">Contractor documents</small></div>
  </div>
  <div class="spacer"></div>
  <span class="sync" id="sync"><i></i><span>Connecting</span></span>
</div></header>
<main id="view"><div class="spin" aria-label="Loading"></div></main>
<nav class="bottom" aria-label="Sections"><div class="in" id="nav"></div></nav>
<div id="modalRoot"></div>

<script>
'use strict';
/* =========================================================================
   MineReady — contractor documents for mine site access (v1.0)
   - Each signed-in account's records live under data/users/<id>/, which the
     platform keeps private to that account (not even the artifact owner sees it).
   - Everything is rendered with textContent / DOM nodes, never innerHTML.
   - Photos are re-encoded in the browser before upload (strips EXIF / GPS).

const APP_VERSION = '1.0.1';
const NS = 'http://www.w3.org/2000/svg';

const DEFAULT_COMPANY_TYPES = [
  'PACRA certificate of incorporation',
  'PACRA annual return',
  'ZRA tax clearance certificate',
  'NAPSA compliance certificate',
  "Workers' Compensation (WCFCB) certificate",
  'Public liability insurance',
  'Safety, health and environment policy'
];
const DEFAULT_WORKER_TYPES = [
  {name:'Medical fitness certificate', perMine:false},
  {name:'Site induction', perMine:true},
  {name:'Working at heights', perMine:false},
  {name:'First aid', perMine:false},
  {name:'Confined space entry', perMine:false},
  {name:'Rigging and slinging', perMine:false},
  {name:'Welding certificate', perMine:false},
  {name:'Defensive driving', perMine:false},
  {name:'Fire fighting', perMine:false}
];
const DEFAULT_REQ_COMPANY = ['PACRA certificate of incorporation','ZRA tax clearance certificate','NAPSA compliance certificate'];
const DEFAULT_REQ_WORKER = ['Medical fitness certificate','Site induction'];
const DEFAULT_MINES = [['kansanshi','Kansanshi Mine'],['lumwana','Lumwana Mine'],['mopani','Mopani Copper Mines'],['kcm','KCM Nchanga']];
const WARN_OPTIONS = [14,30,45,60,90];
const STATUS_LABEL = {valid:'Valid', soon:'Expiring', expired:'Expired', missing:'Missing', incomplete:'Incomplete'};
const STATUS_RANK = {expired:0, missing:1, incomplete:2, soon:3, valid:4};
const BLOCKING = new Set(['expired','missing','incomplete']);
/* Document types that may legitimately be recorded with no expiry date (editable under More > Document types) */
const DEFAULT_NO_EXPIRY = ['PACRA certificate of incorporation'];
const DEMO_TEXT = 'DEMONSTRATION ENVIRONMENT – All sample company and worker records are fictional.';

function defaultSettings(){
  return {
    mines: DEFAULT_MINES.map(([id,name])=>({id, name, company:[...DEFAULT_REQ_COMPANY], worker:[...DEFAULT_REQ_WORKER]})),
    companyTypes: [...DEFAULT_COMPANY_TYPES],
    workerTypes: DEFAULT_WORKER_TYPES.map(t=>({...t})),
    noExpiryTypes: [...DEFAULT_NO_EXPIRY],
    warnDays: 30,
    activeMine: 'kansanshi'
  };
}

/* ---------- small helpers ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, String(v));
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const ICONS = {
  home:['M3 10.5 12 3l9 7.5','M5.5 9v11h13V9','M10 20v-5.5h4V20'],
  building:['M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16','M16 9h2a2 2 0 0 1 2 2v10','M2.5 21h19','M8 7.5h4M8 11.5h4M8 15.5h4'],
  users:['M12.5 8a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0','M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5','M16 4.6a3.5 3.5 0 0 1 0 6.8','M18 14.8c1.8.7 3 2.4 3.5 5.2'],
  file:['M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z','M14 3v5h5','M9 13h6M9 17h6'],
  more:['M5 12h.01','M12 12h.01','M19 12h.01'],
  plus:['M12 5v14','M5 12h14'],
  check:['M5 12.5l4.5 4.5L19 7.5'],

  clip:['M20.5 11.5l-8.3 8.3a5 5 0 0 1-7.1-7.1l8.3-8.3a3.3 3.3 0 0 1 4.7 4.7l-8.3 8.3a1.7 1.7 0 0 1-2.4-2.4l7.6-7.6'],
  download:['M12 4v11','M7 10.5l5 5 5-5','M5 20h14'],

  chat:['M4.5 19.5l1.2-3.6A8 8 0 1 1 8.2 18.4z','M9 10.5h6M9 13.5h4'],

  shield:['M12 2.5 4.5 5.5v6c0 4.8 3.2 8.4 7.5 10 4.3-1.6 7.5-5.2 7.5-10v-6z','M8.5 12l2.5 2.5 4.5-5'],

function icon(name, size=20, sw=1.8){
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('width', size); svg.setAttribute('height', size); svg.setAttribute('viewBox','0 0 24 24');
  svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor');

const clean = (s, max=200) => String(s ?? '').replace(/[\u0000-\u001F\u007F]/g,' ').replace(/\s+/g,' ').trim().slice(0, max);
const cleanMulti = (s, max=1000) => String(s ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,'').replace(/\r\n?/g,'\n').trim().slice(0, max);
const uniq = a => [...new Set(a)];

function ymd(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseD(s){ if (typeof s!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d] = s.split('-').map(Number); const dt = new Date(y, m-1, d); return (dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d) ? dt : null; }
const isDate = s => !!parseD(s);

function fmtDate(s){ const d=parseD(s); return d ? d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '–'; }
function fmtShort(s){ const d=parseD(s); if (!d) return '–'; const sameYear = d.getFullYear()===new Date().getFullYear(); return d.toLocaleDateString('en-GB', sameYear ? {day:'numeric',month:'short'} : {day:'numeric',month:'short',year:'numeric'}); }
function fmtMonthYear(s){ const d=parseD(s); return d ? d.toLocaleDateString('en-GB',{month:'short',year:'numeric'}) : '–'; }
function plural(n, w){ return `${n} ${w}${n===1?'':'s'}`; }
function $(id){ return document.getElementById(id); }
function toast(msg, bad){ const t=h('div',{class:'toast'+(bad?' bad':''),role:'status',text:msg}); document.body.append(t); setTimeout(()=>t.remove(), 3800); }
function errMsg(e){
  if (e && e.userMsg) return e.message;
  const c = e && e.code;
  if (c==='quota_exceeded' || c==='quota_or_state') return 'Storage is full. Remove old documents or files and try again.';
  if (c==='resource_exhausted' || c==='rate_limited') return 'Too many changes at once. Wait a moment and try again.';
  if (c==='invalid_argument') return "You don't have permission to save here, or the record was too large.";
  if (c==='too_large') return 'That file is too large (20 MB maximum).';
  if (c==='unsupported_type') return 'That file type is not supported. Use a photo (JPG or PNG) or a PDF.';
  if (c==='revoked') return 'Your access changed. Reload the page.';
  if (c==='declined') return 'Download cancelled.';
  return 'Something went wrong. Check your connection and try again.';
}
function userErr(msg){ const e = new Error(msg); e.userMsg = true; return e; }
function serialQueue(){ const m=new Map(); return (k, fn)=>{ const p=(m.get(k)||Promise.resolve()).catch(()=>{}).then(fn); m.set(k,p); return p; }; }
async function withRetry(fn){ try{ return await fn(); } catch(e){ if (e && (e.code==='unavailable' || e.code==='store_unavailable')){ await sleep(400+Math.random()*700); return fn(); } throw e; } }
function armConfirm(btn, label, armedLabel, fn){
  let armed = false, t = null;
  btn.addEventListener('click', ()=>{
    if (!armed){ armed = true; btn.textContent = armedLabel; t = setTimeout(()=>{ armed=false; btn.textContent=label; }, 4000); return; }
    clearTimeout(t); fn();
  });
  return btn;
}

/* ---------- sanitising data read back from storage ---------- */
function sanitizeFile(f){
  if (!f || typeof f!=='object') return null;
  if (!['asset','inline','mem','dev'].includes(f.kind)) return null;
  if (typeof f.id!=='string' || !/^[A-Za-z0-9_-]{6,64}$/.test(f.id)) return null;
  const type = f.type==='application/pdf' ? 'application/pdf' : 'image/jpeg';
  return {kind:f.kind, id:f.id, type, w:Math.max(0,Math.min(10000,Number(f.w)||0)), h:Math.max(0,Math.min(10000,Number(f.h)||0)), name:clean(f.name,120), size:Math.max(0,Number(f.size)||0)};
}
function sanitizeRec(r, fallbackId){
  if (!r || typeof r!=='object') return null;
  const type = clean(r.type,80); if (!type) return null;
  const id = /^[A-Za-z0-9]{4,40}$/.test(r.id||'') ? r.id : fallbackId;
  if (!id || !/^[A-Za-z0-9]{4,40}$/.test(id)) return null;
  return {
    id, type, mine: clean(r.mine,40), ref: clean(r.ref,60),
    issued: isDate(r.issued) ? r.issued : '', expires: isDate(r.expires) ? r.expires : '',
    noExpiry: r.noExpiry===true, file: sanitizeFile(r.file), notes: cleanMulti(r.notes,500),
    sample: r.sample===true, sampleNoCopy: r.sampleNoCopy===true, updatedAt: Number(r.updatedAt)||0
  };
}
function sanitizeWorker(w, id){
  if (!w || typeof w!=='object' || !/^[A-Za-z0-9]{4,40}$/.test(id)) return null;
  const name = clean(w.name,80); if (!name) return null;
  const docs = Array.isArray(w.docs) ? w.docs.slice(0,80).map(d=>sanitizeRec(d, null)).filter(Boolean) : [];
  return {
    id, name, job: clean(w.job,60), empNo: clean(w.empNo,30), phone: clean(w.phone,24).replace(/[^0-9+ ]/g,''),
    required: Array.isArray(w.required) ? uniq(w.required.slice(0,30).map(x=>clean(x,80)).filter(Boolean)) : [],
    docs, sample: w.sample===true, createdAt: Number(w.createdAt)||0
  };
}
function sanitizeProfile(p){
  if (!p || typeof p!=='object') return null;
  return { name: clean(p.name,100), pacra: clean(p.pacra,40), tpin: clean(p.tpin,20), contact: clean(p.contact,80),
    phone: clean(p.phone,24).replace(/[^0-9+ ]/g,''), email: clean(p.email,100), address: clean(p.address,160), sample: p.sample===true };
}
function sanitizeSettings(s){
  const d = defaultSettings();
  if (!s || typeof s!=='object') return d;
  const strList = (a, n, max) => Array.isArray(a) ? uniq(a.slice(0,n).map(x=>clean(x,max)).filter(Boolean)) : null;
  const companyTypes = strList(s.companyTypes, 40, 80) || d.companyTypes;
  const workerTypes = Array.isArray(s.workerTypes) ? s.workerTypes.slice(0,40).map(t=>({name:clean(t&&t.name,80), perMine:!!(t&&t.perMine)})).filter(t=>t.name) : d.workerTypes;
  const seen = new Set();
  const mines = Array.isArray(s.mines) ? s.mines.slice(0,20).map(m=>({
      id: (typeof (m&&m.id)==='string' && /^[a-z0-9-]{1,40}$/.test(m.id)) ? m.id : '',
      name: clean(m&&m.name,60), company: strList(m&&m.company,30,80)||[], worker: strList(m&&m.worker,30,80)||[]
    })).filter(m=>m.id && m.name && !seen.has(m.id) && seen.add(m.id)) : d.mines;
  const warnDays = WARN_OPTIONS.includes(Number(s.warnDays)) ? Number(s.warnDays) : 30;
  let activeMine = typeof s.activeMine==='string' ? s.activeMine : '';
  if (!mines.some(m=>m.id===activeMine)) activeMine = mines[0] ? mines[0].id : '';
  const noExpiryTypes = strList(s.noExpiryTypes, 40, 80) || [...DEFAULT_NO_EXPIRY];
  return {mines, companyTypes, workerTypes, noExpiryTypes, warnDays, activeMine};
}

/* =========================================================================
   Storage. Records (all private to the signed-in account):
     data/users/<id>/profile        company details
     data/users/<id>/settings       mines, requirements, document types
     data/users/<id>/cd_<rid>       one company document each
     data/users/<id>/w_<wid>        one worker each, with their documents
     data/users/<id>/files/f/<fid>  photo copies, only when file storage is unavailable
   Files (photos, PDFs) go to the artifact's asset store; records keep only the id.
   ========================================================================= */
function makeCloudStore(db, uid, assets){
  const base = 'data/users/' + uid;
  const q = serialQueue();
  const ref = id => db.doc(base + '/' + id);
  const fileDoc = fid => db.doc(base + '/files').collection('f').doc(fid);
  async function fileUrl(f){
    if (f.kind==='asset') return '/_blob/' + f.id;
    if (f.kind==='inline'){ const s = await withRetry(()=>fileDoc(f.id).get()); const d = s.exists ? s.data() : null; return d && typeof d.data==='string' && d.data.startsWith('data:image/jpeg;base64,') ? d.data : null; }
    return null;
  }
  return {
    kind:'cloud', uid, pdfUploads: !!assets,
    subscribe(next, err){ return db.collection(base).onSnapshot(s=>next(s.docs.map(d=>({id:d.id, data:d.data()})), s.metadata), err); },
    put(id, data){ return q(id, ()=>withRetry(()=>ref(id).set(data))); },
    del(id){ return q(id, ()=>withRetry(()=>ref(id).delete())); },
    async upload(prep){
      if (assets){
        try{
          const r = await withRetry(()=>assets.upload(prep.blob, {type: prep.type}));
          return {kind:'asset', id:r.id, type:prep.type, w:prep.w||0, h:prep.h||0, name:prep.name, size:r.sizeBytes||prep.blob.size};
        }catch(e){
          const lifecycle = e && ['not_granted','capability_disabled','capability_removed'].includes(e.code);
          if (!lifecycle || prep.type!=='image/jpeg') throw e;
        }
      }
      if (prep.type!=='image/jpeg') throw userErr('PDF uploads need edit access to MineReady. Take a photo of the document instead.');
      const small = await shrinkForInline(prep.blob);
      const fid = randId(16);
      await withRetry(()=>fileDoc(fid).set({data:small.dataUrl, type:'image/jpeg', w:small.w, h:small.h, at:Date.now()}));
      return {kind:'inline', id:fid, type:'image/jpeg', w:small.w, h:small.h, name:prep.name, size:small.bytes};
    },
    fileUrl,
    async fileBlob(f){
      if (f.kind==='asset'){ const r = await fetch('/_blob/' + f.id); if (!r.ok) throw userErr('A file could not be loaded.'); return await r.blob(); }
      const u = await fileUrl(f); if (!u) throw userErr('A file could not be loaded.'); return dataUrlToBlob(u);
    },
    async removeFile(f){ try{ if (f.kind==='asset' && assets) await assets.delete(f.id); else if (f.kind==='inline') await fileDoc(f.id).delete(); }catch{} }
  };
}
/* In-memory store with the same interface: used when the page runs outside claude.ai or signed out */
function makeMemoryStore(){
  const docs = new Map(), files = new Map(); let sub = null;
  const emit = () => { if (sub) sub([...docs.entries()].map(([id,data])=>({id, data:deep(data)})), {fromCache:false}); };
  return {
    kind:'memory', uid:'local', pdfUploads:true,
    subscribe(next){ sub = next; setTimeout(emit, 0); return ()=>{ sub=null; }; },
    async put(id, data){ docs.set(id, deep(data)); emit(); },
    async del(id){ docs.delete(id); emit(); },
    async upload(prep){ const id = randId(16); files.set(id, prep.blob); return {kind:'mem', id, type:prep.type, w:prep.w||0, h:prep.h||0, name:prep.name, size:prep.blob.size}; },
    async fileUrl(f){ const b = files.get(f.id); return b ? URL.createObjectURL(b) : null; },
    async fileBlob(f){ const b = files.get(f.id); if (!b) throw userErr('A file could not be loaded.'); return b; },
    async removeFile(f){ files.delete(f.id); }
  };
}

/* Phone storage (IndexedDB): used by the Android app and any browser outside claude.ai.
   Records and file copies stay on this device only. */
function idbReq(req){ return new Promise((res, rej)=>{ req.onsuccess = ()=>res(req.result); req.onerror = ()=>rej(req.error); }); }
function idbOpen(){
  return new Promise((res, rej)=>{
    if (typeof indexedDB === 'undefined') return rej(new Error('no indexedDB'));
    const r = indexedDB.open('mineready', 1);
    r.onupgradeneeded = ()=>{ const d = r.result; if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs'); if (!d.objectStoreNames.contains('files')) d.createObjectStore('files'); };
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); r.onblocked = ()=>rej(new Error('blocked'));
  });
}
async function makeDeviceStore(){
  const idb = await idbOpen();
  try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch{}
  const os = (name, mode) => idb.transaction(name, mode).objectStore(name);
  let sub = null;
  const emit = async () => {
    if (!sub) return;
    const s = os('docs','readonly');
    const [keys, vals] = await Promise.all([idbReq(s.getAllKeys()), idbReq(s.getAll())]);
    if (sub) sub(keys.map((k,i)=>({id:String(k), data:vals[i]})), {fromCache:false});
  };
  return {
    kind:'device', uid:'device', pdfUploads:true,
    subscribe(next, err){ sub = next; emit().catch(e=>err && err({code:'unavailable', message:String(e)})); return ()=>{ sub=null; }; },
    async put(id, data){ await idbReq(os('docs','readwrite').put(deep(data), id)); await emit(); },
    async del(id){ await idbReq(os('docs','readwrite').delete(id)); await emit(); },
    async upload(prep){ const id = randId(16); await idbReq(os('files','readwrite').put(prep.blob, id)); return {kind:'dev', id, type:prep.type, w:prep.w||0, h:prep.h||0, name:prep.name, size:prep.blob.size}; },
    async fileUrl(f){ const b = await idbReq(os('files','readonly').get(f.id)); return b ? URL.createObjectURL(b) : null; },
    async fileBlob(f){ const b = await idbReq(os('files','readonly').get(f.id)); if (!b) throw userErr('A file could not be loaded.'); return b; },
    async removeFile(f){ try{ await idbReq(os('files','readwrite').delete(f.id)); }catch{} }
  };
}

/* Android app bridge: saving, sharing and opening files, copying text */
const ANDROID = (typeof window !== 'undefined' && window.AndroidBridge) ? window.AndroidBridge : null;
function bytesToB64(u8){ let s = ''; for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s); }
function mimeFor(name){ const e = String(name).split('.').pop().toLowerCase(); return ({pdf:'application/pdf', zip:'application/zip', csv:'text/csv', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', txt:'text/plain'})[e] || 'application/octet-stream'; }
async function bridgeSend(filename, data, action){
  const blob = data instanceof Blob ? data : new Blob([data]);
  const u8 = new Uint8Array(await blob.arrayBuffer());
  const fail = r => { const e = new Error(String(r).replace(/^error\|/,'') || 'The file could not be saved.'); e.userMsg = true; return e; };
  let r = String(ANDROID.begin(filename, mimeFor(filename))); if (!r.startsWith('ok')) throw fail(r);
  const CH = 3*131072;
  for (let i=0;i<u8.length;i+=CH){ r = String(ANDROID.chunk(bytesToB64(u8.subarray(i, i+CH)))); if (!r.startsWith('ok')) throw fail(r); }
  r = String(ANDROID.finish(action)); if (!r.startsWith('ok')) throw fail(r);
  return r.slice(3);
}
function makeAndroidDownloads(){
  return { async save({filename, data}){ const where = await bridgeSend(filename, data, 'save'); return {status:'saved', where}; } };
}

/* Ordinary browsers: iPhone/Android share sheet where available, otherwise a normal download */
function makeWebDownloads(){
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return { async save({filename, data}){
    const blob = new Blob([data], {type: mimeFor(filename)});
    if (mobile && navigator.share && navigator.canShare){
      try{
        const file = new File([blob], filename, {type: mimeFor(filename)});
        if (navigator.canShare({files:[file]})){ await navigator.share({files:[file], title: filename}); return {status:'shared'}; }
      }catch(e){ if (e && e.name === 'AbortError'){ const x = new Error('cancelled'); x.code = 'declined'; throw x; } }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 60000);
    return {status:'saved'};
  } };
}

/* ---------- images ---------- */
function loadImage(blob){
  return new Promise((res, rej)=>{ const url = URL.createObjectURL(blob); const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); res(img); }; img.onerror = ()=>{ URL.revokeObjectURL(url); rej(userErr('That image could not be read. Try another photo.')); }; img.src = url; });
}
function canvasToJpeg(cv, q){
  return new Promise((res, rej)=>{ if (!cv.toBlob) return rej(userErr('This browser cannot prepare images.')); cv.toBlob(b=> b ? res(b) : rej(userErr('This browser cannot prepare images.')), 'image/jpeg', q); });
}
async function toJpeg(blob, max, q){
  const img = await loadImage(blob);
  const s = Math.min(1, max/Math.max(img.naturalWidth||img.width, img.naturalHeight||img.height));
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round((img.naturalWidth||img.width)*s)); cv.height = Math.max(1, Math.round((img.naturalHeight||img.height)*s));
  const g = cv.getContext('2d'); if (!g) throw userErr('This browser cannot prepare images.');
  g.fillStyle = '#FFFFFF'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(img,0,0,cv.width,cv.height);
  const out = await canvasToJpeg(cv, q);
  return {blob:out, w:cv.width, h:cv.height};
}
function blobToDataUrl(b){ return new Promise((res, rej)=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); }); }
function dataUrlToBlob(u){ const [head, b64] = u.split(','); const bin = atob(b64); const a = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a], {type: (head.match(/data:([^;]+)/)||[])[1] || 'application/octet-stream'}); }
async function shrinkForInline(blob){
  let max = 1400, q = 0.72;
  for (let i=0;i<7;i++){
    const r = await toJpeg(blob, max, q); const url = await blobToDataUrl(r.blob);
    if (url.length <= 190000) return {dataUrl:url, w:r.w, h:r.h, bytes:r.blob.size};
    max = Math.round(max*0.82); q = Math.max(0.45, q-0.06);
  }
  throw userErr('That photo is too detailed to store. Try a closer, simpler photo.');
}
async function prepareUpload(file){
  if (!file) return null;
  const isPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name||'');
  if (isPdf){
    if (file.size > 20*1024*1024) throw userErr('That PDF is over 20 MB.');
    if (!S.store.pdfUploads) throw userErr('PDF uploads need edit access to MineReady. Take a photo of the document instead.');
    return {blob:file, type:'application/pdf', name:clean(file.name,120)||'document.pdf'};
  }
  if (/^image\//.test(file.type||'') || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(file.name||'')){
    if (file.size > 40*1024*1024) throw userErr('That image is too large.');
    const r = await toJpeg(file, 2000, 0.82);
    return {blob:r.blob, type:'image/jpeg', w:r.w, h:r.h, name:clean(file.name,120)||'photo.jpg'};
  }
  throw userErr('Choose a photo or a PDF.');
}

/* =========================================================================
   State and status logic
   ========================================================================= */
const S = {
  ready:false, loaded:false, store:null, sync:'connecting', syncNote:'',
  profile:null, settings:defaultSettings(), settingsSaved:false, companyDocs:[], workers:[],
  downloads:null, tab:'home', workerId:null, modalOpen:false, dirty:false,
  wq:'', wfilter:'all', fileMine:null, fileSel:null, fileSelMine:null, busy:false, progressEl:null
};
const mineById = id => S.settings.mines.find(m=>m.id===id) || null;
const activeMine = () => mineById(S.settings.activeMine) || S.settings.mines[0] || null;
function workerType(name){ return S.settings.workerTypes.find(t=>t.name===name) || {name, perMine:false}; }
function best(recs){
  let b = null, bs = -Infinity;
  for (const r of recs){
    const d = parseD(r.expires); const s = r.noExpiry ? Infinity : (d ? d.getTime() : -1e15);
    if (s > bs || (s === bs && (r.updatedAt||0) > ((b&&b.updatedAt)||0))){ b = r; bs = s; }
  }
  return b;
}
/* v1.0.1 validation. One place decides a record's status; everything else (dashboard,
   profiles, filters, readiness, PDF, CSV) reads it from here.
     missing    no record for a required document
     expired    expiry date has passed
     incomplete no copy attached, blank expiry date, or "no expiry" on a type not allowed it
     soon       valid but expires within the warning window
     valid      copy attached and dates valid                                              */
const noExpiryAllowed = type => (S.settings.noExpiryTypes || DEFAULT_NO_EXPIRY).includes(type);
const hasCopy = rec => !!(rec && (rec.file || (rec.sample && !rec.sampleNoCopy)));
function problemsOf(rec){
  if (!rec) return [];
  const p = [];
  if (!hasCopy(rec)) p.push('nocopy');
  if (rec.noExpiry){ if (!noExpiryAllowed(rec.type)) p.push('noexpiry-not-allowed'); }
  else if (!isDate(rec.expires)) p.push('noexpiry');
  return p;
}
function statusOf(rec){
  if (!rec) return 'missing';
  const n = rec.noExpiry ? null : daysUntil(rec.expires);
  if (n != null && n < 0) return 'expired';
  if (problemsOf(rec).length) return 'incomplete';
  if (n != null && n <= S.settings.warnDays) return 'soon';
  return 'valid';
}
function statusText(st, rec){
  if (st==='missing' || !rec) return 'Missing';
  if (st==='incomplete'){ const p = problemsOf(rec); return p.includes('nocopy') && p.length===1 ? 'Incomplete · no copy' : p.includes('nocopy') ? 'Incomplete' : 'Incomplete · no expiry date'; }
  if (rec.noExpiry) return 'Valid · expiry N/A';
  const n = daysUntil(rec.expires);
  if (st==='expired') return 'Expired ' + fmtShort(rec.expires);
  if (st==='soon') return n===0 ? 'Expires today' : `Expires in ${plural(n,'day')}`;
  return rec.expires ? 'Valid to ' + fmtMonthYear(rec.expires) : 'Valid';
}
function docLabel(type, mineId){ return workerType(type).perMine && mineId ? `${type} (${(mineById(mineId)||{name:mineId}).name})` : type; }
function evaluate(mineId){
  const mine = mineById(mineId) || S.settings.mines[0] || {id:'', name:'No mine set up', company:[], worker:[]};
  const counts = {valid:0, soon:0, expired:0, missing:0, incomplete:0};
  const company = mine.company.map(type=>{ const rec = best(S.companyDocs.filter(d=>d.type===type)); const status = statusOf(rec); counts[status]++; return {type, rec, status}; });
  const workers = S.workers.map(w=>{
    const req = uniq([...mine.worker, ...w.required]);
    const items = req.map(type=>{
      const perMine = workerType(type).perMine;
      const rec = best(w.docs.filter(d=>d.type===type && (!perMine || d.mine===mine.id)));
      const status = statusOf(rec); counts[status]++;
      return {type, rec, status, perMine, label: perMine ? `${type} (${mine.name})` : type};
    });
    const blockers = items.filter(i=>BLOCKING.has(i.status));
    const warnings = items.filter(i=>i.status==='soon');
    const has = st => items.some(i=>i.status===st);
    return {w, items, cleared: blockers.length===0, blockers, warnings, has};
  });
  const companyOk = company.every(c=>!BLOCKING.has(c.status));
  const cleared = workers.filter(x=>x.cleared).length;
  const pct = workers.length ? Math.round(cleared/workers.length*100) : 0;
  return {mine, company, workers, companyOk, counts, cleared, pct};
}
/* Needs-attention list: exactly the required documents for the selected mine that are not valid,
   so its count always matches the dashboard tiles (expiring + expired + missing + incomplete). */
function attentionItems(ev){
  const out = [];
  for (const c of ev.company) if (c.status!=='valid') out.push({kind:'company', type:c.type, rec:c.rec, status:c.status});
  for (const x of ev.workers) for (const i of x.items) if (i.status!=='valid') out.push({kind:'worker', w:x.w, type:i.type, mine:i.perMine ? ev.mine.id : '', rec:i.rec, status:i.status, label:i.label});
  out.sort((a,b)=> STATUS_RANK[a.status]-STATUS_RANK[b.status] || ((a.rec ? daysUntil(a.rec.expires)||0 : 0) - (b.rec ? daysUntil(b.rec.expires)||0 : 0)));
  return out;
}
function waNumber(p){
  let d = String(p||'').replace(/\D/g,'');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length===10 && d.startsWith('0')) d = '260' + d.slice(1);
  else if (d.length===9 && /^[79]/.test(d)) d = '260' + d;
  return d.length>=11 && d.length<=15 ? d : null;
}
function waText(w, items){
  if (!items.length) return null;
  const co = (S.profile && S.profile.name) || 'your employer';
  const first = w.name.split(' ')[0];
  const lines = items.map(i=>{ const label = i.label || docLabel(i.type, i.mine);
    if (i.status==='missing' || !i.rec) return `- ${label}: not on file yet`;
    if (i.status==='expired') return `- ${label}: expired on ${fmtDate(i.rec.expires)}`;
    if (i.status==='incomplete') return `- ${label}: ${problemsOf(i.rec).includes('nocopy') ? 'we need a copy of the certificate' : 'we need the expiry date'}`;
    return `- ${label}: expires on ${fmtDate(i.rec.expires)}`; });
  const ask = items.every(i=>i.status==='incomplete') ? 'Please send me what is needed' : 'Please renew it and send me a copy';
  return `Hello ${first}, this is a reminder from ${co}.\n${lines.join('\n')}\n${ask} so you can keep working on site. Thank you.`;
}
function waLink(w, items){
  const num = waNumber(w.phone); const text = waText(w, items);
  if (!num || !text) return null;
  return 'https://wa.me/' + num + '?text=' + encodeURIComponent(text);
}

function workerSummary(x){

  if (x.warnings.length){ const i = x.warnings[0]; const n = daysUntil(i.rec.expires); return `${i.perMine ? 'Induction' : i.type} expires in ${plural(n,'day')}`; }
  return x.items.length ? 'All required documents valid' : 'No documents required';
}
const WORKER_FILTERS = [['all','All'],['cleared','Cleared'],['blocked','Blocked'],['expired','Expired'],['missing','Missing'],['incomplete','Incomplete'],['soon','Expiring soon']];
const WFILTER_TEST = {
  all: () => true,
  cleared: x => x.cleared,
  blocked: x => !x.cleared,
  expired: x => x.has('expired'),
  missing: x => x.has('missing'),
  incomplete: x => x.has('incomplete'),
  soon: x => x.has('soon')

function viewWorkers(){

  root.append(minePickerLine('Checking for'));
  const q = h('input',{type:'search', placeholder:'Search by name, job or employee no.', 'aria-label':'Search workers', value:S.wq});
  /* Worker filters count WORKERS (for the selected mine). A worker appears under Expired / Missing /
     Incomplete / Expiring soon if at least one of their required documents has that status, so one worker
     can appear under several. The dashboard "Expiring" tile counts DOCUMENTS (company + worker). */
  if (!WORKER_FILTERS.some(f=>f[0]===S.wfilter)) S.wfilter = 'all';
  const nOf = id => ev.workers.filter(WFILTER_TEST[id]).length;

  const box = h('div',{class:'card flush'});

    if (!S.workers.length){ box.append(h('div',{class:'empty'}, h('p',null,'No workers yet.'), h('p',{class:'small'},'Add the people you send to site, then attach their medicals, inductions and training certificates.'))); return; }

/* Explanation and corrective action for one outstanding requirement */
function reasonFor(i, mine){
  const name = i.label || i.type;
  if (i.status==='missing') return i.perMine
    ? {why:`No ${i.type.toLowerCase()} for ${mine.name} is on file. ${mine.name} requires it before this worker can go on site.`, fix:`Complete the ${mine.name} induction and upload proof of it.`, btn:'Add induction'}
    : {why:`No ${name} is on file. ${mine.name} requires it before this worker can go on site.`, fix:`Upload a copy of the ${name} with its expiry date.`, btn:'Add document'};
  if (i.status==='expired'){ const n = -daysUntil(i.rec.expires);
    return {why:`Expired on ${fmtDate(i.rec.expires)} (${plural(n,'day')} ago).`, fix:`Upload a renewed ${name} and enter the new expiry date.`, btn:'Update document'}; }
  if (i.status==='incomplete'){
    const p = problemsOf(i.rec), why = [], fix = [];
    if (p.includes('nocopy')){ why.push('No copy of the certificate is attached.'); fix.push('Upload the missing document copy (photo or PDF).'); }
    if (p.includes('noexpiry')){ why.push('The expiry date is blank.'); fix.push(noExpiryAllowed(i.type) ? 'Enter the expiry date, or confirm that expiry is not applicable.' : 'Enter the expiry date.'); }
    if (p.includes('noexpiry-not-allowed')){ why.push('It is marked as never expiring, but this document type must have an expiry date.'); fix.push('Enter the expiry date shown on the certificate.'); }
    return {why: why.join(' '), fix: fix.join(' '), btn: p.includes('nocopy') ? 'Attach copy' : 'Enter expiry date'};
  }
  if (i.status==='soon'){ const n = daysUntil(i.rec.expires); return {why: n===0 ? 'Expires today.' : `Expires on ${fmtDate(i.rec.expires)}, in ${plural(n,'day')}.`, fix:`Arrange the renewal before it expires, then upload the new ${name}.`, btn:'Update document'}; }
  return null;
}
function whySection(w, x, ev){
  const sec = h('section',{class:'card flush'});

function fileSummaryText(ev, chosen){
  const p = S.profile || {};

  lines.push('', `Workers cleared for site (${chosen.length}):`);

function setProgress(t){ if (S.progressEl) S.progressEl.textContent = t; }
async function generate(kind, ev, chosen){
  if (S.busy) return;
  if (!S.downloads){ toast('Downloads are not available in this view.', true); return; }
  S.busy = true; softRender(); setProgress('Preparing documents…');
  try{
    const plan = await buildPlan(ev, chosen, setProgress);
    setProgress('Building the PDF…');
    const pdf = buildPdf(plan);
    const base = `Contractor-file_${safeName((S.profile&&S.profile.name)||'Company')}_${safeName(ev.mine.name)}_${ymd(today0())}`;
    let data = pdf, filename = base + '.pdf';
    if (kind==='zip'){
      setProgress('Packing the ZIP…');
      const files = [{name: base + '.pdf', data: new Uint8Array(await pdf.arrayBuffer())}];
      for (const a of plan.attachments) files.push({name:a.name, data:a.bytes});
      data = makeZip(files); filename = base + '.zip';
    }
    setProgress(ANDROID ? 'Saving…' : 'Confirm the download to save it…');
    const res = await S.downloads.save({filename, data});
    if (ANDROID){ S.lastSaved = filename; setProgress(`Saved ${filename} to ${(res && res.where) || 'Downloads/MineReady'}`); toast('Saved to ' + ((res && res.where) || 'Downloads/MineReady')); }
    else { setProgress(`Saved ${filename}`); toast('Contractor file saved.'); }
  }catch(e){
    if (e && e.code==='declined') setProgress('Download cancelled.');
    else { setProgress(''); toast(errMsg(e), true); }
  }
  S.busy = false; const keep = S.progressEl ? S.progressEl.textContent : ''; softRender(); setProgress(keep);
}

  const isCompany = holder==='company';
  const w = isCompany ? null : S.workers.find(x=>x.id===holder);
  if (!isCompany && !w){ toast('That worker was not found.', true); return; }
  const types = isCompany ? S.settings.companyTypes : S.settings.workerTypes.map(t=>t.name);
  const cur = rec ? deep(rec) : {type:type||'', mine:mine||'', ref:'', issued:'', expires:'', noExpiry:false, file:null, notes:''};
  const typeOpts = uniq([...types, ...(cur.type && !types.includes(cur.type) ? [cur.type] : [])]);

  const curType = () => typeSel.value==='__other' ? clean(other.value,80) : typeSel.value;
  const sync = () => {
    other.style.display = typeSel.value==='__other' ? '' : 'none';
    mineWrap.style.display = (!isCompany && workerType(curType()).perMine) ? '' : 'none';
    noExpWrap.style.display = (noExpiryAllowed(curType()) || noExp.checked) ? '' : 'none';
    expires.disabled = noExp.checked; expWrap.style.opacity = noExp.checked ? '.5' : '1';
  };
  typeSel.addEventListener('change', sync); other.addEventListener('input', sync); noExp.addEventListener('change', sync);

  // file handling
  let file = cur.file, newPrep = null, removeOld = false;
  const fileInfo = h('div',{class:'hint'});
  const fileBox = h('div',{class:'filebox'});
  const input = h('input',{type:'file', accept:'image/*,application/pdf', class:'sr', id:'df-file'});
  const drawFile = async () => {
    fileBox.textContent = '';
    const shown = newPrep || file;
    const thumb = h('div',{class:'thumb'}, icon(shown && shown.type==='application/pdf' ? 'file' : 'upload', 24));
    fileBox.append(thumb);
    const info = h('div',{style:'flex:1;min-width:140px'});
    if (shown){
      info.append(h('div',{class:'small',style:'font-weight:600;overflow-wrap:anywhere'}, shown.name || (shown.type==='application/pdf' ? 'PDF document' : 'Photo')),
        h('div',{class:'xs muted'}, (shown.type==='application/pdf' ? 'PDF' : 'Photo') + (newPrep ? ' · will upload when you save' : ' · attached')));
      if (shown.type==='image/jpeg'){
        try{ const url = newPrep ? URL.createObjectURL(newPrep.blob) : await S.store.fileUrl(file); if (url){ const img = h('img',{class:'thumb', src:url, alt:''}); thumb.replaceWith(img); } }catch{}
      }
    } else info.append(h('div',{class:'small',style:'font-weight:600'},'No copy attached'), h('div',{class:'xs muted'},'Take a photo of the certificate or choose a PDF.'));
    fileBox.append(info);
    const btns = h('div',{class:'row',style:'gap:6px'});
    btns.append(h('label',{for:'df-file', class:'btn sm', style:'cursor:pointer'}, icon(shown ? 'edit' : 'upload', 16), shown ? 'Replace' : 'Add photo or PDF'));
    if (!newPrep && file) btns.append(h('button',{type:'button', class:'btn sm', onclick:()=>openFileViewer(file, cur.type)}, 'View'));
    if (shown) btns.append(h('button',{type:'button', class:'btn sm danger', 'aria-label':'Remove file', onclick:()=>{ if (newPrep){ newPrep=null; } else { removeOld = true; file = null; } input.value=''; fileInfo.textContent=''; drawFile(); }}, icon('trash',16)));
    fileBox.append(btns);
  };
  input.addEventListener('change', async ()=>{
    const f = input.files && input.files[0]; if (!f) return;
    fileInfo.textContent = 'Preparing…';
    try{ newPrep = await prepareUpload(f); fileInfo.textContent = newPrep.type==='image/jpeg' ? `Photo ready (${Math.round(newPrep.blob.size/1024)} KB, location data removed).` : `PDF ready (${Math.round(newPrep.blob.size/1024)} KB).`; }
    catch(e){ newPrep = null; fileInfo.textContent = errMsg(e); }
    drawFile();
  });
  drawFile();

  const err = h('div',{class:'err', role:'alert'});
  const save = h('button',{type:'submit', class:'btn primary block'}, 'Save document');
  const form = h('form',{novalidate:true},
    h('p',{class:'small muted',style:'margin:-6px 0 12px'}, isCompany ? ((S.profile&&S.profile.name) || 'Company document') : w.name),
    h('div',{class:'field'}, h('label',{class:'lbl', for:'df-type'},'Document'), typeSel, other),
    mineWrap,
    field('Certificate / reference no.', refIn, null, 'df-ref'),
    h('div',{class:'grid2'}, field('Issue date', issued, null, 'df-iss'), expWrap),
    noExpWrap,
    h('p',{class:'hint',style:'margin:-6px 0 12px'}, 'Without a copy attached, this document counts as Incomplete and does not clear the worker.'),
    h('div',{class:'field'}, h('span',{class:'lbl'},'Copy of the document'), fileBox, input, fileInfo),
    field('Notes', notes, null, 'df-notes'),
    err, save);
  typeSel.id = 'df-type';
  sync();
  form.addEventListener('submit', async ev=>{
    ev.preventDefault(); err.textContent = '';
    const t = curType();
    if (!t){ err.textContent = 'Choose which document this is.'; typeSel.focus(); return; }
    const perMine = !isCompany && workerType(t).perMine;
    if (perMine && !mineById(mineSel.value)){ err.textContent = 'Choose the mine this induction is for.'; return; }
    if (noExp.checked && !noExpiryAllowed(t)){ err.textContent = 'This document type must have an expiry date. Untick "Expiry not applicable" and enter the date. (Types allowed to never expire are set under More > Document types.)'; return; }
    if (!noExp.checked && !isDate(expires.value)){ err.textContent = noExpiryAllowed(t) ? 'Enter the expiry date, or tick "Expiry not applicable".' : 'Enter the expiry date.'; expires.focus(); return; }
    if (issued.value && !isDate(issued.value)){ err.textContent = 'Check the issue date.'; return; }
    if (issued.value && expires.value && !noExp.checked && expires.value < issued.value){ err.textContent = 'The expiry date is before the issue date.'; return; }
    save.disabled = true; save.textContent = newPrep ? 'Uploading…' : 'Saving…';
    const oldFile = rec && rec.file;
    let uploaded = null;
    try{
      if (newPrep) uploaded = await S.store.upload(newPrep);
      const out = {
        id: rec ? rec.id : randId(10), type:t, mine: perMine ? mineSel.value : '', ref: clean(refIn.value,60),
        issued: isDate(issued.value) ? issued.value : '', expires: noExp.checked ? '' : expires.value, noExpiry: noExp.checked,
        file: uploaded || file || null, notes: cleanMulti(notes.value,500), sample: !!(rec && rec.sample), sampleNoCopy: !!(rec && rec.sampleNoCopy) && !(uploaded || file), updatedAt: Date.now()
      };
      if (isCompany){
        if (!S.settingsSaved) await saveSettings(S.settings);
        await S.store.put('cd_' + out.id, out);
      } else {
        const latest = S.workers.find(x=>x.id===w.id) || w;
        const nw = deep(latest); const i = nw.docs.findIndex(d=>d.id===out.id);
        if (i>=0) nw.docs[i] = out; else nw.docs.push(out);
        if (nw.docs.length > 80){ err.textContent = 'This worker has too many documents. Remove old ones first.'; if (uploaded) S.store.removeFile(uploaded); save.disabled=false; save.textContent='Save document'; return; }
        await S.store.put('w_' + nw.id, nw);
      }
      if (oldFile && (uploaded || removeOld)) S.store.removeFile(oldFile);
      closeModal(); toast('Document saved.');
    }catch(e){
      if (uploaded) S.store.removeFile(uploaded);
      err.textContent = errMsg(e); save.disabled = false; save.textContent = 'Save document';
    }
  });
  if (rec){
    const del = h('button',{type:'button', class:'btn danger block', style:'margin-top:10px'}, icon('trash',16), 'Delete this document');
    armConfirm(del, 'Delete this document', 'Tap again to delete', async ()=>{
      del.disabled = true;
      try{
        if (isCompany) await S.store.del('cd_' + rec.id);
        else { const latest = S.workers.find(x=>x.id===w.id) || w; const nw = deep(latest); nw.docs = nw.docs.filter(d=>d.id!==rec.id); await S.store.put('w_' + nw.id, nw); }
        if (rec.file) S.store.removeFile(rec.file);
        closeModal(); toast('Document deleted.');
      }catch(e){ err.textContent = errMsg(e); del.disabled = false; }
    });
    form.append(del);
  }
  openModal(rec ? 'Update document' : 'Add document', form);
}

async function openFileViewer(file, title){
  const body = h('div',{class:'stack',style:'gap:10px'}, h('p',{class:'muted small'},'Loading…'));
  openModal(title || 'Document', body);
  try{
    const url = await S.store.fileUrl(file);
    body.textContent = '';
    if (!url){ body.append(h('p',{class:'muted'},'This file could not be loaded.')); return; }
    if (file.type==='application/pdf' && ANDROID) body.append(h('p',{class:'small'}, file.name || 'PDF document'), h('button',{type:'button', class:'btn outline', onclick:async ()=>{ try{ await bridgeSend(safeName(title||'document') + '.pdf', await S.store.fileBlob(file), 'open'); }catch(e){ toast(errMsg(e), true); } }}, icon('file',18), 'Open the PDF'));
    else if (file.type==='application/pdf') body.append(h('p',{class:'small'}, file.name || 'PDF document'), h('a',{class:'btn outline', href:url, target:'_blank', rel:'noopener'}, icon('file',18), 'Open the PDF'));
    else body.append(h('img',{class:'preview', src:url, alt:'Copy of ' + (title||'document')}));
  }catch(e){ body.textContent=''; body.append(h('p',{class:'err'}, errMsg(e))); }
}

function slug(s){ return String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30) || 'mine'; }
function openMineForm(m){
  const name = h('input',{type:'text', maxlength:60, value:m?m.name:'', placeholder:'e.g. Kansanshi Mine'});
  const cBoxes = S.settings.companyTypes.map(t=>{ const cb = h('input',{type:'checkbox', value:t, checked: m ? m.company.includes(t) : DEFAULT_REQ_COMPANY.includes(t)}); return {t, cb, el:h('label',{class:'check'}, cb, t)}; });
  const wBoxes = S.settings.workerTypes.map(t=>{ const cb = h('input',{type:'checkbox', value:t.name, checked: m ? m.worker.includes(t.name) : DEFAULT_REQ_WORKER.includes(t.name)}); return {t:t.name, cb, el:h('label',{class:'check'}, cb, t.name + (t.perMine ? ' (for this mine)' : ''))}; });
  const err = h('div',{class:'err', role:'alert'});
  const save = h('button',{type:'submit', class:'btn primary block'}, 'Save mine');
  const form = h('form',{novalidate:true}, field('Mine name', name, null, 'mf-name'),
    h('div',{class:'field'}, h('span',{class:'lbl'},'Company documents this mine requires'), cBoxes.map(b=>b.el)),
    h('div',{class:'field'}, h('span',{class:'lbl'},'Documents every worker needs'), wBoxes.map(b=>b.el)),
    err, save);
  form.addEventListener('submit', async ev=>{
    ev.preventDefault(); err.textContent = '';
    const nm = clean(name.value,60); if (nm.length < 2){ err.textContent = 'Enter the mine name.'; name.focus(); return; }
    const mines = deep(S.settings.mines);
    if (mines.some(x=>x.name.toLowerCase()===nm.toLowerCase() && (!m || x.id!==m.id))){ err.textContent = 'A mine with that name already exists.'; return; }
    const rec = {id: m ? m.id : uniqueMineId(nm, mines), name:nm, company:cBoxes.filter(b=>b.cb.checked).map(b=>b.t), worker:wBoxes.filter(b=>b.cb.checked).map(b=>b.t)};
    if (m){ const i = mines.findIndex(x=>x.id===m.id); mines[i] = rec; } else { if (mines.length >= 20){ err.textContent = 'You can set up at most 20 mines.'; return; } mines.push(rec); }
    save.disabled = true; save.textContent = 'Saving…';
    try{ await saveSettings({...S.settings, mines, activeMine: S.settings.activeMine || rec.id}); closeModal(); toast('Mine saved.'); }
    catch(e){ err.textContent = errMsg(e); save.disabled = false; save.textContent = 'Save mine'; }
  });
  if (m){
    const del = h('button',{type:'button', class:'btn danger block', style:'margin-top:10px'}, icon('trash',16), 'Remove this mine');
    armConfirm(del, 'Remove this mine', 'Tap again to remove', async ()=>{
      const mines = S.settings.mines.filter(x=>x.id!==m.id);
      const am = S.settings.activeMine===m.id ? (mines[0] ? mines[0].id : '') : S.settings.activeMine;
      try{ await saveSettings({...S.settings, mines, activeMine:am}); closeModal(); toast('Mine removed.'); } catch(e){ err.textContent = errMsg(e); }
    });
    form.append(del, h('p',{class:'hint'},'Inductions recorded for this mine stay on the workers.'));
  }
  openModal(m ? 'Edit mine' : 'Add a mine', form);
}
function uniqueMineId(name, mines){ let base = slug(name), id = base, i = 2; while (mines.some(x=>x.id===id)) id = `${base}-${i++}`; return id; }

    field('Company document types', ct, 'One per line.', 'tf-c'),

    field('Types that never expire', nx, 'One per line, spelled exactly as above. Only these can be saved with "Expiry not applicable". Every other document must have an expiry date or it counts as Incomplete.', 'tf-nx'), err, save);
  form.addEventListener('submit', async ev=>{
    ev.preventDefault(); err.textContent = '';

    if (!companyTypes.length || !workerTypes.length){ err.textContent = 'Keep at least one type in each list.'; return; }
    save.disabled = true;
    const allNames = new Set([...companyTypes, ...workerTypes.map(t=>t.name)]);
    const noExpiryTypes = uniq(nx.value.split('\n').map(x=>clean(x,80)).filter(x=>x && allNames.has(x))).slice(0,40);
    try{ await saveSettings({...S.settings, companyTypes, workerTypes, noExpiryTypes}); closeModal(); toast('Document types saved.'); }
    catch(e){ err.textContent = errMsg(e); save.disabled = false; }
  });
  openModal('Document types', form);
}

    p.text(stt, PW-PM-sw+8, 68, 9, true, PC[e.status]);
    p.text(fitText(e.holder + (e.sub ? ', ' + e.sub : ''), PW-2*PM, 11), PM, 88, 11, false, PC.muted);
    const det2 = [e.rec.ref ? 'Ref no. ' + e.rec.ref : '', e.rec.issued ? 'Issued ' + fmtDate(e.rec.issued) : '', e.rec.noExpiry ? 'No expiry' : 'Expires ' + fmtDate(e.rec.expires)].filter(Boolean).join('     ');
    p.text(fitText(det2, PW-2*PM, 9.5), PM, 106, 9.5);
    const id = doc.addImage(e.img);
    const areaY = 122, areaH = 790 - areaY, areaW = PW - 2*PM;
    const s = Math.min(areaW / e.img.w, areaH / e.img.h);
    const iw = e.img.w * s, ih = e.img.h * s;
    const ix = PM + (areaW - iw)/2;
    p.image(id, ix, areaY, iw, ih);
    p.rect(ix, areaY, iw, ih, null, PC.line, 0.6);
    footer(p, e.page);
  }
  return doc.finish(`Contractor file - ${co} - ${mineName}`);
}

const CRC_TABLE = (()=>{ const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c = n; for (let k=0;k<8;k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i=0;i<b.length;i++) c = CRC_TABLE[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files){
  const enc = new TextEncoder(); const parts = [], central = []; let offset = 0;
  const d = new Date(); const time = (d.getHours()<<11) | (d.getMinutes()<<5) | Math.floor(d.getSeconds()/2); const date = ((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate();
  for (const f of files){
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true); lh.setUint16(10,time,true); lh.setUint16(12,date,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,time,true); ch.setUint16(14,date,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s,b)=>s+b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(4,0,true); end.setUint16(6,0,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,offset,true); end.setUint16(20,0,true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type:'application/zip'});
}

/* =========================================================================
   Boot
   ========================================================================= */
function ingest(docs){
  let profile = null, settings = null; const cds = [], ws = [];
  for (const {id, data} of docs){
    if (!data || typeof data !== 'object') continue;
    if (id === 'profile') profile = sanitizeProfile(data);
    else if (id === 'settings') settings = data;
    else if (id.startsWith('cd_')){ const d = sanitizeRec(data, id.slice(3)); if (d) cds.push(d); }
    else if (id.startsWith('w_')){ const w = sanitizeWorker(data, id.slice(2)); if (w) ws.push(w); }
  }
  S.profile = profile;
  if (settings){ S.settings = sanitizeSettings(settings); S.settingsSaved = true; }
  S.companyDocs = cds.sort((a,b)=>a.type.localeCompare(b.type));
  S.workers = ws.sort((a,b)=>a.name.localeCompare(b.name));
  S.loaded = true;
}
async function boot(){
  renderChrome();
  let db = null, user = null, assets = null, downloads = null;
  try{
    if (typeof claude !== 'undefined' && claude && typeof claude.use === 'function'){
      [db, user, assets, downloads] = await Promise.all(['db','user','assets','downloads'].map(n=>Promise.resolve(claude.use(n)).catch(()=>null)));
    }
  }catch{}
  let uid = null;
  if (db && user){ try{ uid = await user.id(); }catch{} }
  S.downloads = downloads || (ANDROID ? makeAndroidDownloads() : makeWebDownloads());
  if (db && uid){ S.store = makeCloudStore(db, uid, assets); S.sync = 'connecting'; }
  else if (!db){
    try{ S.store = await makeDeviceStore(); S.sync = 'device'; S.syncNote = 'Saved in this browser on this device'; }
    catch{ S.store = makeMemoryStore(); S.sync = 'local'; S.syncNote = 'Demo mode: not connected to storage'; }
  }
  else { S.store = makeMemoryStore(); S.sync = 'local'; S.syncNote = 'Demo mode: not connected to storage'; }
  S.ready = true;
  route();
  let first = false;
  const timer = setTimeout(()=>{ if (!first && S.store.kind==='cloud'){ S.sync = 'stale'; S.syncNote = "Can't reach your saved records yet. Check your connection."; softRender(); } }, 10000);
  S.store.subscribe((docs, meta)=>{
    ingest(docs);
    if (!first && !(meta && meta.fromCache)){ first = true; clearTimeout(timer); }
    if (S.store.kind==='cloud' && !(meta && meta.fromCache)){ S.sync = 'live'; S.syncNote = 'Saved to your account'; }
    softRender();
  }, e=>{
    clearTimeout(timer);
    S.sync = 'off'; S.syncNote = e && e.code==='revoked' ? 'Your access changed. Reload the page.' : 'Lost connection. Reload the page to reconnect.';
    S.loaded = true; softRender();
  });
}
boot();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
